[package]
name = "netcore-gui"
description = "GTK4 network manager frontend for netcore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "netcore-gui"
path = "src/main.rs"

[dependencies]
cairo-rs = { version = "0.22.11", features = ["png"] }
anyhow.workspace = true
clap.workspace = true
netcore-client.workspace = true
netcore-common.workspace = true
tokio.workspace = true
gtk4 = { version = "0.11.5", features = ["v4_10"] }