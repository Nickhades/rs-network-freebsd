[workspace]
resolver = "3"
members = [
    "crates/netcore-common",
    "crates/netcore-client",
    "crates/netcore-daemon",
    "crates/netcore-cli",
    "crates/netcore-gui",
    "plugins/xfce/netcore-xfce-plugin",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "BSD-2-Clause"
authors = ["netcore contributors"]
description = "Native network manager for FreeBSD"

[workspace.dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
futures-util = "0.3.34"
libc = "0.2.191"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "sync",
    "time",
    "signal",
    "net",
    "io-util",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "6.5.0", features = ["tokio", "tokio-multithread"] }
netcore-common = { path = "crates/netcore-common" }
netcore-client = { path = "crates/netcore-client" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"