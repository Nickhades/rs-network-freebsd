<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- netcore system-bus policy.

       Anyone may talk to the service so read-only desktop integrations work.
       The daemon itself authorizes every mutating method using root, the
       configured administrator group (wheel by default) or polkit. The bus
       policy is therefore defence in depth, not the only control. -->

  <policy user="root">
    <allow own="org.netcore.NetworkManager"/>
    <allow send_destination="org.netcore.NetworkManager"/>
    <allow receive_sender="org.netcore.NetworkManager"/>
  </policy>

  <policy context="default">
    <deny own="org.netcore.NetworkManager"/>
    <allow send_destination="org.netcore.NetworkManager"/>
    <allow receive_sender="org.netcore.NetworkManager"/>
  </policy>
</busconfig>
